name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore

    # This auto-detects and builds any .csproj file in your repository layout
    - name: Build Mod DLL
      run: dotnet build --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CompiledMod-DLL
        path: |
          **/BuildOutput/*.dll
          **/*.dll
